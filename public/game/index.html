<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مين طفّى المدينة؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lalezar&display=swap" rel="stylesheet">
<script src="scene-art.js"></script>
<style>
:root{
  --bg:#E7EAF6; --surface:#FFFFFF; --ink:#141B3A; --muted:#56608A; --line:#C9CFE6;
  --lamp:#FFC247; --lamp-text:#8A5600; --fault:#C23324; --ok:#1F7A4D;
  --night-top:#060A20; --night-low:#151D48; --tower:#161D48; --window:#222B5E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1530; --surface:#1A2247; --ink:#EEF0FA; --muted:#A3ABCF; --line:#313C74;
    --lamp-text:#FFC247; --fault:#FF8A7E; --ok:#6FD6A0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1530; --surface:#1A2247; --ink:#EEF0FA; --muted:#A3ABCF; --line:#313C74;
  --lamp-text:#FFC247; --fault:#FF8A7E; --ok:#6FD6A0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Almarai","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:16px;line-height:1.7;
}
.app{max-width:460px;margin:0 auto;padding:12px 14px 28px}
.app.shake{animation:shake .4s linear}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(9px)}40%{transform:translateX(-9px)}60%{transform:translateX(6px)}80%{transform:translateX(-4px)}}

/* The night scene: always night, in both themes */
.stage{
  position:relative;border-radius:18px;overflow:hidden;
  background:linear-gradient(var(--night-top),var(--night-low));
  transition:background 1.8s ease .4s;
}
.stage svg{display:block;width:100%;height:auto}
.stage .b{fill:var(--tower);transition:fill 1.6s ease .6s,opacity .4s ease}
.stage .w{fill:var(--window);transition:opacity .4s ease}
.stage .moon{fill:#E6EAFF}
.stage .halo{fill:#C9D2FF;opacity:.09}
.stage .crater{fill:#B4BEEA}
.stage .cloud{fill:#070B20;opacity:.85;animation:drift 14s ease-in-out infinite alternate;transition:opacity 1s ease}
.stage .bats{transition:opacity .9s ease}
.stage .bat{fill:#000000;stroke:#55629E;stroke-width:.45;animation:fly linear infinite}
.stage .eye{fill:#FF5A4A;stroke:none}
.stage .flap{transform-box:fill-box;transform-origin:center;animation:flap .22s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(-400px,0)}25%{transform:translate(-200px,-16px)}50%{transform:translate(0,8px)}75%{transform:translate(200px,-12px)}100%{transform:translate(400px,0)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(30px)}}
.stage .st{fill:#FFFFFF;opacity:.22}
.stage .glow{opacity:0;transition:opacity 1.8s ease .5s}
.stage .wire{fill:#FFD97A;transform-box:fill-box;transform:scaleX(0)}
.stage .wire.l{transform-origin:right center}
.stage .wire.r{transform-origin:left center}
.stage .spark{fill:#FFF3C4;opacity:0;transform-box:fill-box;transform-origin:center}
.stage .fw{opacity:0;transform-box:fill-box;transform-origin:center}
.stage h1{
  position:absolute;inset-inline-start:16px;top:10px;margin:0;
  font-family:"Lalezar","Almarai",Tahoma,sans-serif;font-weight:400;
  font-size:1.9rem;line-height:1.2;color:#F3F5FF;
  transition:color 1s ease 1.6s,text-shadow 1s ease 1.6s;
}
.stage .round{position:absolute;inset-inline-start:16px;top:52px;font-size:.82rem;color:#B9C1E8;max-width:70%}
.mute{
  position:absolute;inset-inline-end:10px;top:10px;width:38px;height:38px;border-radius:50%;
  border:0;background:rgba(255,255,255,.14);font-size:1.05rem;cursor:pointer;line-height:1;
}

/* voices from the dark city */
.bubble{position:absolute;max-width:64%;background:#F3F5FF;color:#141B3A;border-radius:14px;padding:6px 10px;font-size:.82rem;font-weight:700;line-height:1.5;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.45);animation:bubIn .25s ease-out}
.bubble[hidden]{display:none}
.bubble::after{content:"";position:absolute;bottom:-7px;left:22px;border:7px solid transparent;border-top-color:#F3F5FF;border-bottom:0}
.bubble.tr::after{left:auto;right:70px}
.bubble.joy{background:#FFE9A8}
.bubble.joy::after{border-top-color:#FFE9A8}
@keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.92)}to{opacity:1;transform:none}}
/* the hospital, running on its generator */
.stage .hosp{fill:#1E2A5C}
.stage .hw{fill:#7FE0B0;opacity:.55;animation:gen 1.1s steps(2,end) infinite}
.stage .hx{fill:#6FD6A0}
@keyframes gen{0%{opacity:.55}50%{opacity:.25}100%{opacity:.6}}
.stage.on .hw,.stage.lit .hw{animation:none;opacity:1;fill:#EAFBF2}

/* the city is the board: five districts you can tap */
.stage .zones{display:none}
.stage.pick .zones{display:block}
.stage .zone{fill:transparent}
.stage.tap .zone{cursor:pointer}
.stage .zsep{stroke:#8E9AD6;stroke-width:.6;stroke-dasharray:3 4;opacity:.7}
.stage .zl{font-family:"Almarai",Tahoma,sans-serif;font-size:9.5px;font-weight:700;fill:#EEF0FA;paint-order:stroke;stroke:#060A20;stroke-width:3px;pointer-events:none}
.stage[data-zone="0"] .zz:not(.z0),.stage[data-zone="1"] .zz:not(.z1),.stage[data-zone="2"] .zz:not(.z2),
.stage[data-zone="3"] .zz:not(.z3),.stage[data-zone="4"] .zz:not(.z4){opacity:.28}
.stage.lz0 .w.z0,.stage.lz1 .w.z1,.stage.lz2 .w.z2,.stage.lz3 .w.z3,.stage.lz4 .w.z4{fill:var(--lamp)}

/* win: power runs along the wire from the repaired spot, windows flicker on as it passes */
.stage.on,.stage.lit{background:linear-gradient(#1B1F52,#5A3A78 70%,#B7653F)}
.stage.on .b,.stage.lit .b{fill:#2F3A7C}
.stage.on .glow,.stage.lit .glow{opacity:.75}
.stage.on .bats,.stage.on .cloud,.stage.lit .bats,.stage.lit .cloud{opacity:0}
.stage.on .wire{animation:run var(--t) linear forwards}
.stage.on .spark{animation:pop .7s ease-out forwards}
.stage.on .w{animation:flick .8s steps(1,end) var(--d) forwards}
.stage.on .w.tv{animation-name:flickTv}
.stage.on .st{animation:tw 1.4s ease-in-out var(--d) infinite alternate}
.stage.on .fw,.stage.party .fw{animation:boom 1.1s ease-out var(--d) 2 both}
.stage.on h1,.stage.lit h1{color:#FFE9A8;text-shadow:0 0 18px rgba(255,194,71,.75)}
.stage.lit .w{fill:var(--lamp)}
.stage.lit .w.tv{fill:#BFE3FF}
.stage.lit .wire{transform:none}
.stage.lit .st{opacity:.9}
@keyframes run{to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(7)}}
@keyframes flick{0%{fill:var(--window)}15%{fill:#FFF3C4}28%{fill:var(--window)}42%{fill:#FFF3C4}52%{fill:var(--window)}66%,100%{fill:var(--lamp)}}
@keyframes flickTv{0%{fill:var(--window)}20%{fill:#FFFFFF}35%{fill:var(--window)}60%,100%{fill:#BFE3FF}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes boom{0%{opacity:1;transform:scale(.08)}65%{opacity:1}100%{opacity:0;transform:scale(1)}}

/* last ten seconds */
.stage.hot{animation:alarm .5s ease-in-out infinite alternate}
@keyframes alarm{from{box-shadow:inset 0 0 0 0 rgba(255,80,60,0)}to{box-shadow:inset 0 0 46px 4px rgba(255,80,60,.6)}}

.timer{margin:12px 2px 0}
.timer[hidden]{display:none}
.timer .tl{font-size:.8rem;color:var(--muted)}
.timer .trow{display:flex;align-items:center;gap:10px}
.timer .track{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--lamp);border-radius:6px}
.timer .tnum{font-family:"Lalezar","Almarai",Tahoma,sans-serif;font-size:1.6rem;line-height:1;min-width:2.2ch;text-align:center}
.timer.hot .fill{background:var(--fault)}
.timer.hot .tnum{color:var(--fault);animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.3)}}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 6px;font-size:.9rem;color:var(--muted)}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:11px;height:11px;border-radius:50%;background:var(--line)}
.pip.left{background:var(--lamp);box-shadow:0 0 0 2px color-mix(in srgb,var(--lamp) 30%,transparent)}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 10px;font-size:.88rem}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:8px;color:var(--lamp-text);font:inherit;font-weight:700;cursor:pointer}
.crumbs span.sep{color:var(--muted)}
.crumbs span.here{padding:4px 6px;color:var(--ink);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel.mt{margin-top:14px}
.panel h2{margin:0 0 6px;font-size:1.05rem;font-weight:800}
.figs{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.now{font-family:"Lalezar","Almarai",Tahoma,sans-serif;font-size:2.4rem;line-height:1.1}
.usual{color:var(--muted);font-size:.9rem}
.diff{color:var(--fault);font-weight:800;font-size:.95rem}
.diff.calm{color:var(--ok)}
.unit{color:var(--muted);font-size:.8rem;margin-top:2px}

.say{margin:14px 2px 10px}
.say.note{color:var(--muted)}
.msg{margin:10px 2px;min-height:1.7em;color:var(--fault);font-weight:700}
.msg.good{color:var(--ok)}

.clues{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.clues li{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--lamp);border-radius:10px;padding:8px 12px;font-size:.93rem}
.ev{background:var(--surface);border:1.5px dashed var(--lamp-text);border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{
  text-align:start;font:inherit;color:var(--ink);cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 12px;min-height:92px;display:flex;flex-direction:column;gap:2px;
}
.tile:active{transform:scale(.97)}
.tile .n{font-weight:700;font-size:.95rem}
.tile .v{font-family:"Lalezar","Almarai",Tahoma,sans-serif;font-size:1.55rem;line-height:1.15}
.tile .u{font-size:.8rem;color:var(--muted)}
.tile .tag{font-size:.75rem;font-weight:700;color:var(--lamp-text)}
.tile[disabled]{cursor:default;opacity:.75}
.tile.clear .tag{color:var(--ok)}
.tile.still{cursor:default}

.btn{
  display:block;width:100%;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;
  background:var(--lamp);color:#141B3A;border:0;border-radius:14px;padding:13px 16px;margin-top:10px;
}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.btn.ghost .tag{color:var(--muted);font-weight:400;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}
.opts .btn{margin-top:8px}

.field{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
textarea.field{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.check input{width:20px;height:20px;margin-top:5px;accent-color:var(--lamp-text);flex:none}

.board{list-style:none;margin:10px 0 0;padding:0;counter-reset:rk}
.board li{counter-increment:rk;display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.board li::before{content:counter(rk);font-family:"Lalezar","Almarai",Tahoma,sans-serif;color:var(--lamp-text);min-width:1.6em}
.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li.me{font-weight:800}

.stars{font-size:1.8rem;letter-spacing:4px;color:var(--lamp-text)}
.stars .off{color:var(--line)}
.pts{font-family:"Lalezar","Almarai",Tahoma,sans-serif;font-size:2rem;line-height:1.2}
.lesson{border-inline-start:4px solid var(--lamp);padding:4px 12px;margin:14px 0;font-weight:700}
.found{margin:8px 0;padding:0 18px 0 0}

button:focus-visible,.field:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
/* Cartoon play stage and responsive game controls. All states come from visible game events. */
.app{max-width:600px;padding:14px 14px 34px}
.play-column{min-width:0}
.stage{border:4px solid #5165a4;box-shadow:0 8px 0 #11183a,0 18px 36px #070b2590;isolation:isolate}
.stage::after{content:"";position:absolute;inset:0;border:6px solid #b9b5db43;border-radius:13px;pointer-events:none;z-index:8}
.stage .moon,.stage .halo,.stage .crater{animation:moonCruise 17s ease-in-out infinite alternate}
.stage .bat{animation-timing-function:ease-in-out}
.stage .flap{animation-duration:.29s}
.stage .b{stroke:#090f31;stroke-width:.75}
.stage .roof{fill:#272b60;stroke:#6574ac;stroke-width:.8}
.stage .door{fill:#11183a;stroke:#59628f;stroke-width:.7}
.stage .trim{fill:#6574ac}
.stage .lamp-post{stroke:#7887b3;stroke-width:1.7;fill:none}
.stage .lamp-head{fill:#f4dfa0;filter:drop-shadow(0 0 4px #f8d589)}
.stage:not(.on):not(.lit) .lamp-head{animation:streetFlicker 4.7s steps(1,end) infinite;opacity:.42}
.stage:not(.on):not(.lit) .lamp-head:nth-of-type(2){animation-delay:-1.35s}
.stage:not(.on):not(.lit) .lamp-head:nth-of-type(3){animation-delay:-2.8s}
@keyframes streetFlicker{0%,11%,16%,49%,57%,100%{opacity:.42;filter:drop-shadow(0 0 2px #f8d589)}12%,14%,51%,54%{opacity:.95;filter:drop-shadow(0 0 8px #f8d589)}}
.stage.on .lamp-head,.stage.lit .lamp-head{filter:drop-shadow(0 0 10px #ffdf79)}
.stage.commerce{background:linear-gradient(#333e83,#75618f 63%,#b37b77)}
.stage.commerce .bats,.stage.commerce .hosp{display:none}
.stage.party::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#ffe78a 0 3px,transparent 4px),radial-gradient(circle,#ff8da6 0 3px,transparent 4px),radial-gradient(circle,#9cf1d3 0 2px,transparent 3px);background-size:87px 132px,109px 157px,73px 118px;background-position:8px -30px,46px -90px,22px -63px;animation:partyFall 2.7s linear infinite}
@keyframes partyFall{to{background-position:8px 102px,46px 67px,22px 55px}}
.actor{position:absolute;left:3%;bottom:0;width:25%;max-width:116px;height:47%;z-index:4;pointer-events:none;filter:drop-shadow(3px 5px 0 #0a1039);animation:actorPop .35s cubic-bezier(.2,1.5,.5,1) both}
.actor.right{left:auto;right:3%}.actor[hidden]{display:none}.actor svg{height:100%;width:100%;overflow:visible}
.bubble{z-index:5;max-width:67%;min-width:44%;padding:8px 12px;border:3px solid #5865a1;border-radius:20px 20px 20px 6px;box-shadow:0 6px 0 #131a47,0 12px 25px #04082090;line-height:1.4}
.bubble.tr{border-radius:20px 20px 6px 20px}.bubble .speaker{display:block;color:#8a4a9c;font-size:.71rem;line-height:1.2;margin-bottom:3px}.bubble .speech{display:block}.bubble.joy{border-color:#efbc65}.bubble .speech span{display:inline-block;animation:wordIn .18s ease-out both}
.stage .round{background:#151b48c9;padding:2px 9px;border:1px solid #7d8abc;border-radius:9px;max-width:78%}
.panel{border:2px solid #acb6da;box-shadow:0 5px 0 #66729b35;background:var(--surface)}
.panel h2{font-size:1.13rem}.panel .now{color:#d18b2e;text-shadow:1px 2px 0 #413d6f35}
.clues li{border:2px solid #c5b9d9;border-inline-start:7px solid #f0b554;box-shadow:2px 3px 0 #302b6d20;transform:rotate(-.25deg)}
.tile{position:relative;border:3px solid #9facd4;border-radius:17px;box-shadow:0 5px 0 #596d9e,0 9px 15px #12245b25;transition:transform .18s cubic-bezier(.2,1.3,.5,1),box-shadow .18s,background .18s;overflow:hidden}
.tile:not([disabled]):hover{transform:translateY(-3px);background:color-mix(in srgb,var(--surface) 86%,#ffe0a0);box-shadow:0 8px 0 #596d9e,0 12px 18px #12245b30}
.tile:not([disabled]):active{transform:translateY(3px);box-shadow:0 2px 0 #596d9e}
.tile .n{font-weight:800}.tile .v{font-size:1.8rem;color:#403f87}.tile.clear{border-color:#7fb995}.tile.still{opacity:.84}
.btn{border:3px solid #ffe6a2;border-radius:16px;box-shadow:0 5px 0 #b37243,0 8px 15px #2d306c35;transition:transform .16s cubic-bezier(.2,1.4,.5,1),box-shadow .16s;background:#ffd16b}
.btn:not([disabled]):hover{transform:translateY(-3px);box-shadow:0 8px 0 #b37243,0 11px 20px #2d306c45}
.btn:not([disabled]):active{transform:translateY(3px);box-shadow:0 2px 0 #b37243}
.btn.ghost{background:var(--surface);border-color:#aab7d8;box-shadow:0 4px 0 #7180ad}
.btn.ghost:not([disabled]):hover{box-shadow:0 7px 0 #7180ad}
.bar{background:#1c285d;color:#fff4da;border:2px solid #8d9aca;border-radius:12px;padding:7px 10px}
.pip{height:14px;width:14px;border:2px solid #8998c8}.pip.left{background:#ffdb78;border-color:#fff1b7;box-shadow:0 0 8px #ffd46d}
.crumbs button{background:#e6dcf2;border:2px solid #a6a2d3;box-shadow:0 2px 0 #8e8fba;padding:3px 9px}
.msg{border-radius:10px}.msg:not(:empty){padding:5px 8px;background:#b0465930}
.msg.good:not(:empty){background:#3c9b6830}
.timer .track{height:14px;border:2px solid #8793c4}.timer .fill{background:linear-gradient(90deg,#ffe991,#f7a44b)}
.stars{filter:drop-shadow(2px 3px 0 #9a7090)}
@keyframes moonCruise{from{transform:translate(-4px,1px)}to{transform:translate(10px,-5px)}}
@keyframes actorPop{from{opacity:0;transform:translateY(26px) scale(.72)}to{opacity:1;transform:none}}
@keyframes wordIn{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(min-width:900px){
  .app{max-width:1260px;display:grid;grid-template-columns:minmax(0,1.22fr) minmax(355px,.78fr);gap:20px;align-items:start;padding:24px}
  .stage{grid-column:1;position:sticky;top:24px}.stage svg#sky{height:min(79vh,670px);object-fit:cover}
  .stage h1{font-size:2.5rem;top:14px}.stage .round{top:65px;font-size:.9rem}
  .play-column{grid-column:2;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin;padding:2px 8px 16px 2px}
  .play-column .panel.mt{margin-top:0}.play-column .grid{gap:12px}.play-column .tile{min-height:100px}
  .actor{height:32%;max-width:160px}.bubble{font-size:.97rem;max-width:54%;min-width:36%}
}
@media(max-width:899px){.app{max-width:610px}.stage svg#sky{min-height:235px}.play-column{margin-top:18px}}
@media(max-width:480px){.app{padding:8px 8px 25px}.stage h1{font-size:1.65rem}.stage .round{top:47px;font-size:.68rem}.actor{width:24%;height:44%}.bubble{font-size:.73rem;padding:6px 8px;max-width:68%}.grid{gap:8px}.tile{min-height:88px;padding:8px}.tile .v{font-size:1.5rem}}
@media (prefers-reduced-motion: reduce){
  .stage,.stage .b,.stage .glow,.stage h1{transition:none}
  .stage.on .w{animation:none;fill:var(--lamp)}
  .stage.on .w.tv{fill:#BFE3FF}
  .stage.on .wire{animation:none;transform:none}
  .stage.on .spark,.stage.on .fw,.stage.party .fw{animation:none}
  .stage.on .st{animation:none;opacity:.9}
  .stage.hot,.timer.hot .tnum,.app.shake{animation:none}
  .stage .bat,.stage .flap,.stage .cloud,.stage .hw,.bubble{animation:none}
  .tile:active{transform:none}
  .actor,.bubble .speech span,.stage .moon,.stage .halo,.stage .crater,.stage.party::before{animation:none}
}
</style>
<link rel="stylesheet" href="look.css">
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <svg id="sky" viewBox="0 0 360 250" role="img" aria-label="منظر المدينة بالليل"></svg>
    <h1 id="stageTitle">مين طفّى المدينة؟</h1>
    <div class="round" id="round"></div>
    <button class="mute" id="mute" aria-label="تشغيل أو كتم الصوت">🔊</button>
    <div class="actor" id="actor" hidden aria-hidden="true"></div>
    <div class="bubble" id="bubble" hidden></div>
  </div>

    bubble.hidden=true;actor.hidden=true;
  }
  function showBubble(o,joyful,ms){
    var words=String(o.t).split(/\s+/).map(function(w,i){return '<span style="animation-delay:'+(i*0.025).toFixed(2)+'s">'+esc(w)+'</span>';}).join(' ');
    bubble.innerHTML=(o.who?'<strong class="speaker">'+esc(o.who)+'</strong>':'')+'<span class="speech">'+words+'</span>';
    bubble.className='bubble'+(o.tr?' tr':'')+(joyful?' joy':'');
    bubble.style.left=o.left||'5%';bubble.style.right=o.right||'auto';bubble.style.bottom=o.bottom||'42%';
    actor.innerHTML=characterSvg(o.role||'worker');actor.dataset.role=o.role||'worker';actor.className='actor'+(o.tr?' right':'');actor.hidden=false;
    bubble.hidden=false;
    clearTimeout(bubbleTimer);bubbleTimer=setTimeout(hideBubble,ms||5000);
  }
  function later(visit,ms,fn){
    var id=setTimeout(function(){
      visit.timers.delete(id);
      if(drama===visit) fn();
    },ms);
    visit.timers.add(id);
    return id;
  }
  function releaseVoice(visit){
    var track=visit.track;
    visit.track=null;visit.skipAudio=null;
    if(track){
      track.pause();
      track.removeAttribute('src');
      track.load();
    }
  }
  function stopDialogue(){
    if(drama){
      drama.timers.forEach(function(id){clearTimeout(id);});
      drama.timers.clear();
      releaseVoice(drama);
    }
    stopEffects(sceneEffects);
    hideBubble();
  }
  function closeDialogue(){
    stopDialogue();
    drama=null;
  }
  function advanceDialogue(visit){
    var line=visit.lines[visit.index++];
    if(!line) return;
    var meta=VOICE[line.audio], duration=meta?meta.ms:5000, started=false;
    function startLine(){
      if(started) return;
      started=true;
      if(line.beats){
        line.beats.forEach(function(beat){
          later(visit,beat.at,function(){showBubble(beat,false,beat.ms);});
        });
      }else showBubble(line,false,duration);
      later(visit,duration,function(){
        releaseVoice(visit);hideBubble();
        if(visit.scene==='business') visit.index%=visit.lines.length;
        var gap=meta?(line.beats?1400:2200):4000;
        if(visit.index<visit.lines.length) later(visit,gap,function(){advanceDialogue(visit);});
      });
    }
    if(line.thud) thud();
    if(!sound||!meta){startLine();return;}
    var track=new Audio(VOICE_DIR+meta.file);
    visit.track=track;
    // A blocked or stalled recording still leaves the original text playable.
    function fallback(){
      if(drama!==visit||visit.track!==track) return;
      clearTimeout(wait);visit.timers.delete(wait);
      releaseVoice(visit);startLine();
    }
    var wait=later(visit,1500,fallback);
    visit.skipAudio=fallback;
    track.addEventListener('playing',function(){
      if(drama!==visit||visit.track!==track) return;
      clearTimeout(wait);visit.timers.delete(wait);
      startLine();
    },{once:true});
    track.addEventListener('error',fallback,{once:true});
    track.play().catch(fallback);
  }
  function enterDialogue(silentReturn){
    var node=G.view==='why'?S.whyLeaf:cur();
    if(drama&&drama.node===node) return;
    closeDialogue();
    var scene=silentReturn?null:dialogueScene(), lines=SCENE_LINES[scene];
    var visit={node:node,scene:scene,lines:lines,index:0,timers:new Set(),track:null,skipAudio:null};
    drama=visit;
    if(!lines) return;
    // The street animation flashes at 55% of its 1.5-second duration.
    if(scene==='street') later(visit,825,function(){advanceDialogue(visit);});
    else advanceDialogue(visit);
  }
  window.addEventListener('pagehide',function(){
    stopDialogue();stopEffects(actionEffects);
  });

  /* ---------- the stage follows the game ---------- */
  var sceneKey='';
  function paintScene(){
    var view=G.view, active=!!L&&view!=='home'&&view!=='reflect'&&view!=='board';
    var nodes=active?S.path:[], dim=nodes[1]&&nodes[1].kind==='dim'?nodes[1]:null;
    var axis=dim?dim.key:(L&&L.city?'place':'branch');
    var parts=nodes.slice(1).filter(function(n){return n.kind!=='dim';}).map(function(n){return n.name;});
    if(view==='won') parts=[];
    var scene=active?(L.city?'city':'shop'):'city';
    var mode=(active&&view!=='won'&&parts.length)?axis+'-'+parts.length:(dim?axis:'overview');
    var key=[scene,G.li,mode,parts.join('|'),view==='won'?'won':''].join(':');
    if(key===sceneKey) return;
    sceneKey=key;stage.dataset.scene=mode;
    if(!active||view==='won'||(axis==='place'&&!parts.length)){
      if(scene==='shop') drawShop(); else drawSky(L&&L.city?L.srcZone:null);
    }else if(window.renderMysteryScene){
      sky.innerHTML=window.renderMysteryScene({city:!!L.city,level:G.li,axis:axis,path:parts.length?parts:[dim?dim.name:'']});
    }
    sky.setAttribute('aria-label',scene==='shop'?'منظر من محل الإلكترونيات: '+(parts[parts.length-1]||'الفروع'):
      'منظر '+(parts[parts.length-1]||'المدينة')+' بالليل');
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches && sky.animate)
      sky.animate([{opacity:.45,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:360,easing:'ease-out'});
  }
  function paintStage(){
    var c=stage.classList, v=G.view, cityLevel=L&&L.city;
    var n=inPlay()&&L?cur():null;
    var districts=!!(n&&n.children&&n.children[0].zone!=null);
    c.toggle('pick',districts&&v==='play');
    c.toggle('tap',districts&&v==='play'&&!n.children[0].inert);
    var focus=null;
    if(inPlay()&&L) S.path.forEach(function(p){if(p.zone!=null) focus=p.zone;});
    if(focus==null) stage.removeAttribute('data-zone'); else stage.setAttribute('data-zone',focus);
    stage.dataset.depth=inPlay()?Math.min(4,S.path.length):0;
    stage.style.setProperty('--focus-x',focus==null?'50%':(focus*20+10)+'%');
    c.toggle('scene-repaired',!!(inPlay()&&cityLevel&&focus!=null&&S.lit.indexOf(focus)>=0));
    for(var z=0;z<5;z++) c.toggle('lz'+z,!!(inPlay()&&cityLevel&&S.lit.indexOf(z)>=0));
    var lit=(v==='reflect'||v==='board')||(L&&!L.city&&v!=='home');
    c.toggle('on',v==='won'&&!!cityLevel);
    c.toggle('lit',lit);
    c.toggle('party',v==='won'&&L&&!L.city);
    c.toggle('commerce',!!(L&&!L.city));
    stageTitle.textContent=L&&!L.city?'مين وقّف المبيعات؟':'مين طفّى المدينة؟';
    if(v==='home') roundEl.textContent='';
    else if(v==='reflect'||v==='board') roundEl.textContent='المدينة منوّرة';
    else roundEl.textContent='المهمة '+(G.li+1)+' من '+NL+': '+L.title;
    paintScene();
  }

  /* ---------- leaderboard ---------- */
  function loadBoard(){
    if(!DB){B.state='none';return;}
    B.state='loading';
    var to=setTimeout(function(){if(B.state==='loading'){B.state='timeout';if(G.view==='board') render();}},10000);
    try{
      DB.collection('scores').orderBy('pts','desc').limit(10).get().then(function(q){
        clearTimeout(to);
        B.rows=q.docs.map(function(d){var x=d.data()||{};return {id:d.id,name:String(x.name||'').slice(0,20),pts:+x.pts||0};});
        B.state='ok';if(G.view==='board') render();
      }).catch(function(){clearTimeout(to);B.state='error';if(G.view==='board') render();});
    }catch(e){clearTimeout(to);B.state='error';}
  }
  function saveScore(name,total){
    if(!DB||!UID||B.saving) return;
    B.saving=true;B.err=false;render();
    var ref;
    try{ref=DB.doc('scores/'+UID);}catch(e){B.saving=false;B.err=true;render();return;}
    ref.get().then(function(s){
      var old=s.exists?(+((s.data()||{}).pts)||0):-1;
      if(total>old) return ref.set({name:name,pts:total,at:Date.now()});
    }).then(function(){B.saving=false;B.saved=true;loadBoard();render();})
      .catch(function(){B.saving=false;B.err=true;render();});
  }

  }
  function win(){
    S.secLeft=race()?Math.max(0,Math.ceil(remMs()/1000)):0;
    var st=starsFor(), firsts=S.fixed.filter(function(f){return f.first;}).length;
    G.stars[G.li]=st;
    G.pts[G.li]=st*100+firsts*50+S.secLeft*10;
    G.view='won';
    closeDialogue();
    if(L.city){
      showBubble({t:'النور جه! الحمد لله!',left:'30%',bottom:'50%'},true);
    }else bubble.hidden=true;
    sfx('win');
  }
  function openTile(i){
    var n=cur(), c=n.children[i];
    if(!c||c.inert||c.cleared) return;
    S.msg='';S.good=false;
    if(c.fixable){
      if(c.faulty){
        if(FEAT.why){S.whyLeaf=c;S.whyPath=S.path.concat([c]);S.whyMiss=false;G.view='why';sfx('open');}
        else fixLeaf(c,S.path.concat([c]),false);
      }
      else{
        c.cleared=true;S.used++;
        if(S.deadline) S.deadline-=PENALTY*1000;
        S.msg=c.name+' سليم. خسرت تفكيكة'+(race()?' و'+PENALTY+' ثواني':'')+'.';
        sfx('wrong');shake();
      }
    }else{
      if(!c.opened){
        if(left()<=0){lose('budget');return;}
        c.opened=true;S.used++;startTimer();sfx('open');
      }
      S.path.push(c);
    }
  }
  function answerWhy(i){
    var lf=S.whyLeaf, o=lf.why.opts[i];
    if(!o||o[2]) return;
    if(!o[1]){
      o[2]=true;S.whyMiss=true;S.good=false;
      if(S.deadline) S.deadline-=PENALTY*1000;
      S.msg='الدليل ما بيدعمش السبب ده. اقراه تاني'+(race()?' (خسرت '+PENALTY+' ثواني)':'')+'.';
      sfx('wrong');shake();return;
    }
    fixLeaf(lf,S.whyPath,!S.whyMiss);
  }
  function fixLeaf(lf,path,first){
    lf.faulty=false;lf.cleared=true;lf.done=true;lf.actual-=lf.delta;
    recalc(L);
    S.fixed.push({where:path.slice(2).map(function(p){return p.name;}).join('، '),cause:lf.why.right,first:first});
    path.forEach(function(p){if(p.zone!=null) S.lit.push(p.zone);});
    L.remaining--;
    if(L.remaining<=0){win();return;}
    G.view='play';S.good=true;
    S.msg='اتصلّح سبب، بس '+L.metric+' لسه بعيد عن المعتاد. فيه سبب تاني.';
    sfx('fix');
  }
  function afterMove(silentReturn){
    if(inPlay()){
      if(left()<0||(left()<=0&&G.view==='play'&&!reachable(L.root))) lose('budget');
      else if(S.deadline&&remMs()<=0) lose('time');
    }
    render();
    if(inPlay()) enterDialogue(silentReturn);
    else window.scrollTo({top:0,behavior:'smooth'});
  }

  game.addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]');
    if(!b||b.disabled) return;
    var act=b.getAttribute('data-act');
    prepareEffects();stopEffects(actionEffects);
    if(act!=='tile'&&act!=='why') sfx(act==='up'?'back':'click');
    if(act==='mode'){G.mode=b.getAttribute('data-m');G.pts=[0,0,0,0];G.stars=[0,0,0,0];startLevel(0);return;}
    if(act==='next'){
      if(G.li<NL-1){startLevel(G.li+1);return;}
      if(race()){
        var total=G.pts.reduce(function(a,c){return a+c;},0);
        store('dc_best',String(Math.max(total,+store('dc_best')||0)));
        B.saved=false;B.err=false;G.view='board';loadBoard();
      }else{G.view='reflect';G.compared=false;G.answer='';}
      render();window.scrollTo({top:0,behavior:'smooth'});return;
    }
    if(act==='retry'){startLevel(G.li);return;}
    if(act==='compare'){var ta=document.getElementById('answer');G.answer=ta?String(ta.value||'').trim():'';G.compared=true;render();return;}
    if(act==='unlock'){G.learned=true;store('dc_learned','1');G.view='home';L=null;drawSky(null);render();return;}
    if(act==='save'){
      var inp=document.getElementById('nick'), nm=inp?String(inp.value||'').trim().slice(0,20):'';
      if(!nm) nm='لاعب';
      store('dc_name',nm);
      saveScore(nm,G.pts.reduce(function(a,c){return a+c;},0));return;
    }
    if(act==='again'){G.pts=[0,0,0,0];G.stars=[0,0,0,0];startLevel(0);return;}
    if(act==='home'){G.view='home';L=null;drawSky(null);render();return;}

    if(act==='guess'){S.guessed=b.getAttribute('data-g')==='1';S.msg='';}
    else if(act==='up'){S.path=S.path.slice(0,+b.getAttribute('data-i')+1);S.msg='';}
    else if(act==='tile'){openTile(+b.getAttribute('data-i'));}
    else if(act==='why'){answerWhy(+b.getAttribute('data-i'));}
    afterMove(act==='why'&&G.view==='play');
  });

  /* tapping a district in the picture is the same as tapping its card */
  sky.addEventListener('click',function(e){
    var z=e.target.closest?e.target.closest('.zone'):null;
    if(!z||G.view!=='play'||!stage.classList.contains('tap')) return;
    prepareEffects();stopEffects(actionEffects);
    openTile(4-(+z.getAttribute('data-z')));
    afterMove();
  });

  window.dcDebug={state:function(){return {G:G,S:S,L:L};}};
  drawSky(null);
  render();
})();
</script>
</body>
</html>
